<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务新建 & 编辑 — 设计原型</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary: #1677ff;
      --color-primary-hover: #4096ff;
      --color-primary-bg: #e6f4ff;
      --color-success: #52c41a;
      --color-warning: #faad14;
      --color-danger: #ff4d4f;
      --color-bg: #fafafa;
      --color-surface: #ffffff;
      --color-border: #f0f0f0;
      --color-text: #262626;
      --color-text-secondary: #595959;
      --color-text-placeholder: #bfbfbf;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-modal: 0 6px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
      --shadow-card: 0 1px 3px rgba(0,0,0,0.04);
      --transition: 200ms ease;
    }

    body {
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #e8e8e8;
      min-height: 100vh;
      padding: 40px 20px;
      color: var(--color-text);
    }

    /* ── Modal Overlay ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
      animation: fadeIn 200ms ease;
    }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    /* ── Modal Shell ── */
    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      width: 720px;
      max-width: 95vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ── Modal Header ── */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .modal-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius-md);
      background: var(--color-primary-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--color-primary);
      font-size: 18px;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text);
    }
    .modal-subtitle {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }
    .modal-close {
      width: 32px; height: 32px;
      border: none; background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-secondary);
      font-size: 16px;
      transition: background var(--transition);
    }
    .modal-close:hover { background: var(--color-bg); }

    /* ── Modal Body ── */
    .modal-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left Stepper Sidebar ── */
    .modal-sidebar {
      width: 180px;
      flex-shrink: 0;
      background: #f7f9ff;
      border-right: 1px solid var(--color-border);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 20px 0 20px 20px;
      border-radius: var(--radius-md);
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 13px;
      color: var(--color-text-secondary);
      border: none; background: transparent;
      width: 100%; text-align: left;
    }
    .step-item:hover { background: rgba(22,119,255,0.06); color: var(--color-primary); }
    .step-item.active {
      background: var(--color-primary);
      color: #fff;
      font-weight: 500;
    }
    .step-item .step-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: currentColor;
      color: inherit;
      font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      opacity: 0.7;
    }
    .step-item.active .step-num { opacity: 1; background: rgba(255,255,255,0.25); }

    /* ── Form Area ── */
    .modal-form-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }
    .modal-form-area::-webkit-scrollbar { width: 4px; }
    .modal-form-area::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 2px; }

    .form-section {
      margin-bottom: 24px;
    }
    .form-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .form-row {
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
    .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 13px;
      color: var(--color-text-secondary);
      font-weight: 400;
    }
    .form-label .required { color: var(--color-danger); margin-left: 2px; }

    .form-input {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d9d9d9;
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-surface);
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
      width: 100%;
    }
    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(22,119,255,0.12);
    }
    .form-input::placeholder { color: var(--color-text-placeholder); }
    .form-input:disabled { background: var(--color-bg); cursor: not-allowed; }

    .form-textarea {
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-surface);
      resize: vertical;
      min-height: 72px;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
      width: 100%;
      font-family: inherit;
      line-height: 1.5;
    }
    .form-textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(22,119,255,0.12);
    }

    /* ── Select ── */
    .form-select-wrap { position: relative; }
    .form-select {
      height: 36px;
      padding: 0 32px 0 12px;
      border: 1px solid #d9d9d9;
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-surface);
      appearance: none;
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
      width: 100%;
    }
    .form-select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(22,119,255,0.12);
    }
    .form-select-arrow {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--color-text-secondary);
      font-size: 12px;
    }

    /* ── Tag Pills ── */
    .tag-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-pill {
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
      border: 1.5px solid #d9d9d9;
      background: var(--color-surface);
      cursor: pointer;
      transition: all var(--transition);
      color: var(--color-text-secondary);
    }
    .tag-pill:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .tag-pill.selected {
      border-color: var(--color-primary);
      background: var(--color-primary-bg);
      color: var(--color-primary);
      font-weight: 500;
    }

    /* ── Budget Input ── */
    .budget-input-wrap {
      position: relative;
    }
    .budget-input-wrap .budget-suffix {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--color-text-secondary);
      pointer-events: none;
    }
    .budget-input-wrap .form-input { padding-right: 36px; }

    /* ── Date Range ── */
    .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-range .form-input { flex: 1; }
    .date-range-sep {
      color: var(--color-text-placeholder);
      font-size: 13px;
      flex-shrink: 0;
    }

    /* ── File Upload ── */
    .upload-zone {
      border: 1.5px dashed #d9d9d9;
      border-radius: var(--radius-md);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--color-bg);
    }
    .upload-zone:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-bg);
    }
    .upload-zone-icon {
      font-size: 28px;
      color: var(--color-primary);
      margin-bottom: 8px;
    }
    .upload-zone-text { font-size: 13px; color: var(--color-text-secondary); }
    .upload-zone-text strong { color: var(--color-primary); }
    .upload-zone-hint { font-size: 12px; color: var(--color-text-placeholder); margin-top: 4px; }

    /* ── Edit Modal: Status & Progress ── */
    .info-banner {
      background: linear-gradient(135deg, #e6f4ff 0%, #bae0ff 100%);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .info-banner-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(22,119,255,0.15);
      display: flex; align-items: center; justify-content: center;
      color: var(--color-primary);
      font-size: 15px;
      flex-shrink: 0;
    }
    .info-banner-text { font-size: 13px; color: var(--color-text-secondary); }
    .info-banner-text strong { color: var(--color-text); }

    .progress-track {
      margin-top: 8px;
    }
    .progress-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .progress-label { font-size: 13px; color: var(--color-text-secondary); }
    .progress-value { font-size: 13px; font-weight: 600; color: var(--color-primary); }
    .progress-bar {
      height: 6px;
      background: #e8e8e8;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-primary), #69b1ff);
      border-radius: 3px;
      transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Modal Footer ── */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .btn {
      height: 36px;
      padding: 0 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      border: 1px solid transparent;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-ghost {
      background: transparent;
      border-color: #d9d9d9;
      color: var(--color-text-secondary);
    }
    .btn-ghost:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
    .btn-primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
    .btn-primary:active { transform: scale(0.98); }

    /* ── Read-only Info Grid (edit mode) ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: var(--color-bg);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .info-cell { display: flex; flex-direction: column; gap: 2px; }
    .info-cell-label { font-size: 12px; color: var(--color-text-placeholder); }
    .info-cell-value { font-size: 14px; color: var(--color-text); font-weight: 500; }

    /* ── Nav between modals demo ── */
    .demo-nav {
      display: flex; justify-content: center; gap: 16px;
      margin-bottom: 32px;
    }
    .demo-nav-btn {
      padding: 10px 28px;
      border-radius: 20px;
      border: 2px solid var(--color-border);
      background: var(--color-surface);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--color-text-secondary);
    }
    .demo-nav-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .demo-nav-btn.active {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: #fff;
    }

    .demo-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .demo-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
    }
    .demo-header p {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    /* ── Edit specific: read-only badge ── */
    .readonly-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 4px;
      font-size: 12px;
      color: #fa8c16;
    }

    /* ── Animations ── */
    .step-content { display: none; }
    .step-content.active { display: block; animation: fadeSlide 200ms ease; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     PROTOTYPE NAVIGATOR
═══════════════════════════════════════════════════════════════ -->
<div class="demo-header">
  <h1>任务登记 — 表单设计原型</h1>
  <p>点击下方标签切换「新建任务」与「编辑任务」两种模式</p>
</div>

<div class="demo-nav">
  <button class="demo-nav-btn active" id="btn-create" onclick="showMode('create')">新建任务</button>
  <button class="demo-nav-btn" id="btn-edit" onclick="showMode('edit')">编辑任务</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     MODE A: 新建任务
═══════════════════════════════════════════════════════════════ -->
<div id="mode-create" style="display:flex; justify-content:center;">

<div class="modal-overlay" onclick="event.target===this && closeModal('create')">
  <div class="modal" onclick="event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </div>
        <div>
          <div class="modal-title">新建任务</div>
          <div class="modal-subtitle">填写任务基本信息，创建后可分配开发人员</div>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal('create')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Left Sidebar Stepper -->
      <div class="modal-sidebar">
        <button class="step-item active" data-step="1" onclick="setStep(this, 1)">
          <span class="step-num">1</span>基本信息
        </button>
        <button class="step-item" data-step="2" onclick="setStep(this, 2)">
          <span class="step-num">2</span>详细信息
        </button>
        <button class="step-item" data-step="3" onclick="setStep(this, 3)">
          <span class="step-num">3</span>计划与预算
        </button>
        <button class="step-item" data-step="4" onclick="setStep(this, 4)">
          <span class="step-num">4</span>交付物
        </button>
      </div>

      <!-- Form Area -->
      <div class="modal-form-area">

        <!-- Step 1: 基本信息 -->
        <div class="step-content active" data-step="1">
          <div class="form-section">
            <div class="form-section-title">基本信息</div>
            <div class="form-field" style="margin-bottom:12px;">
              <label class="form-label">任务名称 <span class="required">*</span></label>
              <input type="text" class="form-input" placeholder="请输入任务名称，如：BOSS系统接口优化" value="">
            </div>
            <div class="form-field">
              <label class="form-label">任务描述</label>
              <textarea class="form-textarea" placeholder="请详细描述任务背景、目标和范围..."></textarea>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">分类属性</div>
            <div class="form-row cols-2">
              <div class="form-field">
                <label class="form-label">任务类型 <span class="required">*</span></label>
                <div class="form-select-wrap">
                  <select class="form-select">
                    <option value="">请选择任务类型</option>
                    <option value="development">开发</option>
                    <option value="testing">测试</option>
                    <option value="design">设计</option>
                    <option value="maintenance">运维</option>
                    <option value="deployment">部署</option>
                  </select>
                  <span class="form-select-arrow">
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor"><path d="M1 1l4 4 4-4"/></svg>
                  </span>
                </div>
              </div>
              <div class="form-field">
                <label class="form-label">合作伙伴 <span class="required">*</span></label>
                <div class="form-select-wrap">
                  <select class="form-select">
                    <option value="">请选择合作伙伴</option>
                    <option>华为技术有限公司</option>
                    <option>中兴通讯股份有限公司</option>
                    <option>烽火通信科技股份有限公司</option>
                    <option>中国信科集团</option>
                  </select>
                  <span class="form-select-arrow">
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor"><path d="M1 1l4 4 4-4"/></svg>
                  </span>
                </div>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">优先级</label>
              <div class="tag-pills" id="priority-pills">
                <button type="button" class="tag-pill" onclick="selectPill(this, 'priority')">低</button>
                <button type="button" class="tag-pill selected" onclick="selectPill(this, 'priority')">中</button>
                <button type="button" class="tag-pill" onclick="selectPill(this, 'priority')">高</button>
                <button type="button" class="tag-pill" onclick="selectPill(this, 'priority')">紧急</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Step 2: 详细信息 -->
        <div class="step-content" data-step="2">
          <div class="form-section">
            <div class="form-section-title">执行周期</div>
            <div class="date-range">
              <input type="date" class="form-input" value="2026-04-01">
              <span class="date-range-sep">至</span>
              <input type="date" class="form-input" value="2026-06-30">
            </div>
          </div>
          <div class="form-section">
            <div class="form-section-title">交付标准</div>
            <div class="form-field">
              <textarea class="form-textarea" placeholder="请明确任务交付物的质量标准、验收条件等..."></textarea>
            </div>
          </div>
        </div>

        <!-- Step 3: 计划与预算 -->
        <div class="step-content" data-step="3">
          <div class="form-section">
            <div class="form-section-title">预算信息</div>
            <div class="form-field">
              <label class="form-label">预算金额（元）</label>
              <div class="budget-input-wrap">
                <input type="number" class="form-input" placeholder="0" value="50000">
                <span class="budget-suffix">元</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Step 4: 交付物 -->
        <div class="step-content" data-step="4">
          <div class="form-section">
            <div class="form-section-title">需求文档</div>
            <div class="upload-zone">
              <div class="upload-zone-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
              </div>
              <div class="upload-zone-text">拖拽文件到此处，或 <strong>点击上传</strong></div>
              <div class="upload-zone-hint">支持 PDF、Word、Excel、图片等格式，单个文件不超过 50MB</div>
            </div>
          </div>
        </div>

      </div><!-- /form-area -->
    </div><!-- /modal-body -->

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('create')">取消</button>
      <button class="btn btn-ghost" onclick="prevStep()">上一步</button>
      <button class="btn btn-primary" onclick="nextStep()">下一步</button>
    </div>

  </div><!-- /modal -->
</div><!-- /modal-overlay -->
</div>

<!-- ═══════════════════════════════════════════════════════════════
     MODE B: 编辑任务
═══════════════════════════════════════════════════════════════ -->
<div id="mode-edit" style="display:none; justify-content:center;">

  <div class="modal" style="width:760px;" onclick="event.stopPropagation()">

      <div class="modal-header-left">
        <div class="modal-icon" style="background:#f6ffed;border:1px solid #b7eb8f;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Info Banner (task status snapshot) -->
      <div style="padding:16px 20px 0; flex-shrink:0;">
        <div class="info-banner">
          <div class="info-banner-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div class="info-banner-text">
            当前状态：<strong>进行中</strong> &nbsp;·&nbsp; 负责人：<strong>张伟</strong> &nbsp;·&nbsp;
            剩余时间：<strong style="color:#fa8c16">32 天</strong>
          </div>
          <div style="margin-left:auto; display:flex; gap:8px;">
            <span style="font-size:12px;padding:2px 8px;background:#fff;border:1px solid #d9d9d9;border-radius:4px;color:#595959;border-radius:4px;">
              <span class="readonly-badge" style="margin-right:4px;">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                已锁定
              </span>

        <!-- Progress Track -->
        <div class="progress-track" style="margin-bottom:16px;">

          <div class="progress-bar">
            <div class="progress-fill" style="width:65%"></div>
          </div>
        </div>
      </div>

      <!-- Form Area (single scrollable) -->
      <div class="modal-form-area" style="padding-top:8px;">

        <!-- Section 1 -->
        <div class="form-section">
          <div class="form-section-title">基本信息</div>
          <div class="form-field" style="margin-bottom:12px;">

        <!-- Section 2 -->

            <div class="upload-zone-icon" style="font-size:20px;margin-bottom:4px;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

<script>
  let currentStep = 1;

  function showMode(mode) {
    document.getElementById('btn-create').classList.toggle('active', mode === 'create');
    document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
    document.getElementById('mode-create').style.display = mode === 'create' ? 'flex' : 'none';
    document.getElementById('mode-edit').style.display = mode === 'edit' ? 'flex' : 'none';
    currentStep = 1;
    updateStepUI();
  }

  function setStep(el, step) {
    currentStep = step;
    updateStepUI();
  }

  function updateStepUI() {
    document.querySelectorAll('.step-item').forEach(item => {
      item.classList.toggle('active', parseInt(item.dataset.step) === currentStep);
    });
    document.querySelectorAll('.step-content').forEach(content => {
      content.classList.toggle('active', parseInt(content.dataset.step) === currentStep);
    });
  }

  function nextStep() {
    if (currentStep < 4) { currentStep++; updateStepUI(); }
  }
  function prevStep() {
    if (currentStep > 1) { currentStep--; updateStepUI(); }
  }

  function closeModal(mode) {
    const overlay = document.querySelector(`#mode-${mode} .modal-overlay`);
    if (overlay) overlay.style.display = 'none';
  }

  function selectPill(el, type) {
    const container = el.parentElement;
    container.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
  }

  // Initialize: show create modal by default
  document.getElementById('mode-create').style.display = 'flex';
</script>

</body>
