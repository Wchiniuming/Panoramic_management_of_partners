<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合作伙伴支撑能力全景管理平台 - 登录</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1890ff;
            --primary-hover: #40a9ff;
            --primary-light: rgba(24, 144, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #1890ff 0%, #36c1fc 100%);
            --bg: #f8fafc;
            --card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.06);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            line-height: 1.5;
        }

        /* Left Panel - Modern Illustration */
        .illustration-panel {
            flex: 1.2;
            background: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 50%, #f0f9ff 100%);
            padding: 80px 64px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
        }

        .bg-shape-1 {
            width: 500px;
            height: 500px;
            background: rgba(24, 144, 255, 0.15);
            top: -200px;
            right: -100px;
        }

        .bg-shape-2 {
            width: 400px;
            height: 400px;
            background: rgba(56, 239, 125, 0.1);
            bottom: -150px;
            left: -100px;
        }

        .bg-shape-3 {
            width: 300px;
            height: 300px;
            background: rgba(168, 85, 247, 0.08);
            top: 50%;
            left: 30%;
        }

        .illustration-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 560px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--card);
            border-radius: 100px;
            box-shadow: var(--shadow-md);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 32px;
            width: fit-content;
        }

        .brand-badge-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        .illustration-title {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
        }

        .illustration-title span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .illustration-desc {
            font-size: 18px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 48px;
            max-width: 440px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        .stat-item {
            text-align: left;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Floating Cards */
        .floating-card {
            position: absolute;
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-xl);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .floating-card-1 {
            top: 20%;
            right: 15%;
            animation-delay: 0s;
        }

        .floating-card-2 {
            bottom: 25%;
            right: 10%;
            animation-delay: -2s;
        }

        .floating-card-3 {
            top: 40%;
            right: 5%;
            animation-delay: -4s;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .card-icon.blue { background: rgba(24, 144, 255, 0.1); color: var(--primary); }
        .card-icon.green { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .card-icon.purple { background: rgba(168, 85, 247, 0.1); color: #a855f7; }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Right Panel - Login Form */
        .form-panel {
            width: 520px;
            padding: 80px 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--card);
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-logo {
            width: 48px;
            height: 48px;
            background: var(--primary-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(24, 144, 255, 0.3);
        }

        .form-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .form-desc {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            font-size: 15px;
            font-family: inherit;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card);
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:hover {
            border-color: #cbd5e1;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition);
        }

        .form-input.with-icon {
            padding-left: 48px;
        }

        .form-input:focus ~ .input-icon {
            color: var(--primary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            border-radius: 4px;
        }

        .remember-me span {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .forgot-link {
            font-size: 14px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--primary-hover);
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            background: var(--primary-gradient);
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(24, 144, 255, 0.3);
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(24, 144, 255, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #94d0ff;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .oauth-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .oauth-btn {
            height: 48px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .oauth-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .oauth-btn svg {
            width: 22px;
            height: 22px;
            color: var(--text-secondary);
        }

        .form-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .form-footer p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-footer span {
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-top: 12px;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .illustration-panel {
                display: none;
            }
            .form-panel {
                width: 100%;
                padding: 60px 40px;
            }
        }

        @media (max-width: 480px) {
            .form-panel {
                padding: 40px 24px;
            }
        }

        /* Animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-panel {
            animation: fadeInUp 0.6s ease-out;
        }

        .illustration-content {
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
</head>
<body>
    <!-- Left Illustration Panel -->
    <div class="illustration-panel">
        <div class="bg-shape bg-shape-1"></div>
        <div class="bg-shape bg-shape-2"></div>
        <div class="bg-shape bg-shape-3"></div>

        <div class="illustration-content">
            <div class="brand-badge">
                <span class="brand-badge-dot"></span>
                <span>企业级管理平台</span>
            </div>

            <h1 class="illustration-title">
                合作伙伴支撑能力<br>
                <span>全景管理平台</span>
            </h1>

            <p class="illustration-desc">
                整合开发人员管理、任务调度、厂商评估与风险控制，构建高效的合作伙伴支撑体系
            </p>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value">500+</div>
                    <div class="stat-label">合作开发人员</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">98%</div>
                    <div class="stat-label">任务完成率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">50+</div>
                    <div class="stat-label">合作伙伴</div>
                </div>
            </div>
        </div>

        <!-- Floating Cards -->
        <div class="floating-card floating-card-1">
            <div class="card-icon blue">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            </div>
            <div class="card-title">开发人员</div>
            <div class="card-value">128</div>
        </div>

        <div class="floating-card floating-card-2">
            <div class="card-icon green">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <div class="card-title">已完成任务</div>
            <div class="card-value">1,284</div>
        </div>

        <div class="floating-card floating-card-3">
            <div class="card-icon purple">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                </svg>
            </div>
            <div class="card-title">评估得分</div>
            <div class="card-value">92.5</div>
        </div>
    </div>

    <!-- Right Login Form Panel -->
    <div class="form-panel">
        <div class="form-header">
            <div class="form-logo">H</div>
            <h2 class="form-title">欢迎回来</h2>
            <p class="form-desc">请登录您的账号以继续</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input with-icon" 
                        placeholder="请输入用户名"
                        autocomplete="username"
                    >
                    <span class="input-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input with-icon" 
                        placeholder="请输入密码"
                        autocomplete="current-password"
                    >
                    <span class="input-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot-link">忘记密码？</a>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">登 录</button>

            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">或</span>
                <span class="divider-line"></span>
            </div>

            <div class="oauth-buttons">
                <button type="button" class="oauth-btn" title="企业微信">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8.5 11a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm5 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
                        <path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.936 1.526 5.55 3.926 7.227l-.926 2.781 3.252-1.627c.857.213 1.8.33 2.748.33 5.523 0 10-4.145 10-9.243S17.523 2 12 2z"/>
                    </svg>
                </button>
                <button type="button" class="oauth-btn" title="钉钉">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.03 2 10.99c0 2.55 1.25 4.83 3.21 6.48l-.78 2.44 2.78-1.62c.8.22 1.64.34 2.5.34 3.03 0 5.79-1.14 7.76-3.02 1.97 1.88 4.73 3.02 7.76 3.02.86 0 1.7-.12 2.5-.34l2.78 1.62-.78-2.44c1.96-1.65 3.21-3.93 3.21-6.48C22 6.03 17.52 2 12 2z"/>
                    </svg>
                </button>
                <button type="button" class="oauth-btn" title="飞书">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M5 5h14v14H5V5zm2 2v10h10V7H7zm2 2h6v2H9V9zm0 4h6v2H9v-2z"/>
                    </svg>
                </button>
            </div>
        </form>

        <div class="form-footer">
            <p>遇到问题？联系管理员获取帮助</p>
            <span>默认账号: admin / admin123</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = '登 录';
                console.log('Login attempt:', { username });
            }, 1500);
        });
    </script>
</body>
</html>
